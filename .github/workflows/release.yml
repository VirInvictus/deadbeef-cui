name: Release

# The plugin-update rule (2026-09-13): from v1.3.4 onward, every release tag
# ships the rebuilt plugin binary as a Release asset on green CI. This workflow
# builds the .so from the tag, runs the test suite, and only on success creates
# the GitHub Release with ddb_misc_cui_GTK3.so attached. The Release body is
# the tag's own message, which is the verbatim patchnotes entry (house tagging
# procedure).
#
# Constraint: GitHub evaluates workflow files at the pushed ref, so this only
# fires for tags cut at commits that CONTAIN this file (v1.3.4 predates it; its
# asset was attached manually per the rule's fallback). Cut every later tag on
# or after the commit that carries this workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build + test (fedora)
    runs-on: ubuntu-latest
    # Same toolchain as ci.yml: the plugin builds against the DeaDBeeF plugin
    # API headers from RPM Fusion's deadbeef-devel, plus GTK3.
    container: fedora:latest
    steps:
      - name: Enable RPM Fusion (free)
        run: |
          dnf install -y \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"

      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            cmake \
            make \
            pkgconf-pkg-config \
            gtk3-devel \
            deadbeef-devel

      - uses: actions/checkout@v4

      - name: cmake configure
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: cmake build
        run: cmake --build build

      - name: ctest
        run: ctest --test-dir build --output-on-failure

      - name: Upload plugin binary
        uses: actions/upload-artifact@v4
        with:
          name: ddb_misc_cui_GTK3
          path: build/ddb_misc_cui_GTK3.so
          if-no-files-found: error

  release:
    name: create Release with the plugin binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh's --verify-tag / --notes-from-tag shell out to git, which needs a
      # repository: without a checkout the job fails with "not a git
      # repository" (learned cutting v1.3.6). On a tag-triggered run this
      # checks out the tag ref, whose annotation IS the release body.
      - uses: actions/checkout@v4

      - name: Download plugin binary
        uses: actions/download-artifact@v4
        with:
          name: ddb_misc_cui_GTK3

      - name: Create Release and attach binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No explicit --repo: gh derives the repository from
          # GITHUB_REPOSITORY.
          #
          # Notes come from the tag annotation extracted by git, not gh's
          # --notes-from-tag: that flag resolved the COMMIT message on this
          # runner (observed on v1.3.7 and v1.3.8; each Release body needed
          # a manual gh release edit afterward). The house tagging procedure
          # makes the annotation the verbatim patchnotes entry; the heading
          # check refuses to publish anything thinner.
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          head -1 release-notes.md | grep -q '^## v' || {
            echo "release notes do not start with a patchnotes heading; refusing to publish" >&2
            exit 1
          }
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file release-notes.md \
            ddb_misc_cui_GTK3.so
